[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
# The deploy scripts write the deployed addresses into addresses.json;
# VenusRescueProposal reads them from it.
fs_permissions = [{ access = "read-write", path = "../addresses.json" }, { access = "write", path = "./out/vip-proposal.json" }]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_mev = "${BSC_MEV_RPC_URL}" # MEV-protected, for --broadcast
